<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Palette Studio favicon">
  <defs>
    <radialGradient id="g" cx="38%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#d9f0ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0b1020" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="rim" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background (helps in pinned tabs / transparent contexts) -->
  <rect width="128" height="128" rx="28" fill="url(#g)"/>

  <!-- palette body -->
  <path
    d="M94 24c-24.3-7.6-57.2 4.8-66.7 28.3C17.9 76.8 34.6 102 62 102h9c7.2 0 11.1-5.4 11.1-10.3 0-4.7-3.2-8.6-7.7-9.9l-4.7-1.3c-3.8-1.1-6.2-4.4-6.2-8.3 0-4.9 3.9-8.9 8.9-8.9h10.3c12.5 0 22.7-10.2 22.7-22.7C105.4 33.5 101 26.3 94 24Z"
    fill="#0b1020"
    opacity="0.92"
    filter="url(#s)"
  />

  <!-- rim highlight -->
  <path
    d="M90.8 29.6c-22.2-6.8-51.6 4.9-59.8 25.7-8.3 21 6.3 41.7 28.9 41.7h7.2c4.7 0 7.3-3.6 7.3-6.8 0-3-2.1-5.6-5.1-6.5l-4.2-1.2c-6.8-2-11.2-8.3-11.2-15.4 0-8.8 7.1-15.9 15.9-15.9h8.8c10 0 18.2-8.1 18.2-18.2 0-6.1-2.1-10.5-6-12.4Z"
    fill="none"
    stroke="url(#rim)"
    stroke-width="4.5"
    stroke-linecap="round"
    opacity="0.95"
  />

  <!-- paint dabs -->
  <circle cx="44" cy="54" r="8.5" fill="#22c55e"/>
  <circle cx="66" cy="40" r="7.5" fill="#38bdf8"/>
  <circle cx="84" cy="54" r="7.5" fill="#a78bfa"/>
  <circle cx="52" cy="76" r="7.2" fill="#fb7185"/>

  <!-- thumb hole -->
  <circle cx="84.5" cy="76.5" r="10.5" fill="#0b1020"/>
  <circle cx="84.5" cy="76.5" r="10.5" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
</svg>
